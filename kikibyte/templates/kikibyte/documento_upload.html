<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Documento</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f6f2ee; color: #2e241b; }
        .page { max-width: 840px; margin: 40px auto; padding: 28px; background: #fff; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
        h1 { margin-top: 0; }
        form { display: grid; gap: 18px; }
        label { display: grid; gap: 8px; font-weight: 700; }
        input, textarea, select { width: 100%; border: 1px solid #dfd2c3; border-radius: 16px; padding: 14px 16px; font-size: 1rem; }
        .actions { display: flex; gap: 14px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 22px; border-radius: 16px; text-decoration: none; color: #fff; font-weight: 700; }
        .btn-primary { background: #793A14; }
        .btn-secondary { background: #f4e8df; color: #2e241b; border: 1px solid rgba(121,58,20,0.18); }
        .message { padding: 16px 18px; border-radius: 18px; background: #def7e1; color: #175f24; }
    </style>
</head>
<body>
    <main class="page">
        <h1>Upload de Documento</h1>
        <p>Adicione um documento fictício para demonstração.</p>
        {% if messages %}
        <div class="message">
            {% for message in messages %}
                <div>{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>
                Título
                <input type="text" name="titulo" placeholder="Relatório de Segurança" required>
            </label>
            <label>
                Tipo de Documento
                <input type="text" name="tipo_documento" placeholder="Relatório">
            </label>
            <label>
                Cliente
                <select name="cliente_id" required>
                    <option value="">Escolha um cliente</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id_cliente }}">{{ cliente.nome }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>
                Visível para Cliente
                <input type="checkbox" name="visivel_cliente">
            </label>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar documento</button>
                <a href="{% url 'kikibyte:dashboard' %}?tab=documentos" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
